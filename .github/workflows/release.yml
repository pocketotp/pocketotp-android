name: Release

on:
  push:
    tags: ["v*"]
  # Dry run on PRs that touch the pipeline: build, sign and verify, but don't publish.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/build.gradle.kts"
      - "scripts/**"
      - "CHANGELOG.md"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Check tag matches versionName
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag versionName=$ver"
            test "$tag" = "$ver" || { echo "::error::tag v$tag does not match versionName $ver"; exit 1; }
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Changelog section
        run: |
          scripts/changelog-section.sh "$VERSION" > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no section for [$VERSION]"; exit 1; }

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETOTP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::POCKETOTP_KEYSTORE_BASE64 secret missing"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          POCKETOTP_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          POCKETOTP_KEYSTORE_PASSWORD: ${{ secrets.POCKETOTP_KEYSTORE_PASSWORD }}
          POCKETOTP_KEY_PASSWORD: ${{ secrets.POCKETOTP_KEY_PASSWORD }}
          POCKETOTP_KEY_ALIAS: pocketotp
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and hash
        env:
          EXPECTED_CERT_SHA256: 7fca5c4e3608171f85913ec4c8a018af94c5d9642a888df6ffcc280e88c34ddf
        run: |
          out="pocketotp-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$out" | tee signer.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" signer.txt || { echo "::error::unexpected signing certificate"; exit 1; }
          sha256sum "$out" > "$out.sha256"
          cat "$out.sha256"
          {
            echo
            echo "---"
            echo "**SHA-256** \`$(cut -d' ' -f1 "$out.sha256")\`"
            echo
            echo "Signing certificate SHA-256: \`7F:CA:5C:4E:36:08:17:1F:85:91:3E:C4:C8:A0:18:AF:94:C5:D9:64:2A:88:8D:F6:FF:CC:28:0E:88:C3:4D:DF\` ([how to verify](https://github.com/${{ github.repository }}/blob/main/docs/verify-apk.md))"
          } >> release-notes.md

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload dry-run artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pocketotp-${{ env.VERSION }}-dryrun
          path: |
            pocketotp-*.apk
            pocketotp-*.apk.sha256
            release-notes.md
          retention-days: 7

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "pocketotp-$VERSION.apk" "pocketotp-$VERSION.apk.sha256" \
            --title "PocketOTP $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
